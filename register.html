{% extends "base.html" %}

{% block title %}
Register | SecureScan
{% endblock %}

{% block content %}

<div class="auth">
<div class="auth-icon">
    🔐
</div>

<h1>Create Account</h1>

<p class="muted">
    Start analyzing files and URLs securely.
</p>

<form method="POST">

    <label>
        Username
    </label>

    <input
        type="text"
        name="username"
        minlength="3"
        autocomplete="username"
        required
    >

    <label>
        Email
    </label>

    <input
        type="email"
        name="email"
        autocomplete="email"
        required
    >

    <label>
        Password
    </label>

    <input
        type="password"
        name="password"
        minlength="8"
        autocomplete="new-password"
        required
    >

    <button type="submit">
        Create Account
    </button>

</form>

<p class="auth-footer">

    Already registered?

    <a href="{{ url_for('login') }}">
        Login
    </a>

</p>

</div>
{% endblock %}
