{% extends "base.html" %}

{% block title %}
Login | SecureScan
{% endblock %}

{% block content %}

<div class="auth">
<div class="auth-icon">
    🛡️
</div>

<h1>Welcome Back</h1>

<p class="muted">
    Sign in to access SecureScan.
</p>

<form method="POST">

    <label>
        Username
    </label>

    <input
        type="text"
        name="username"
        autocomplete="username"
        required
    >

    <label>
        Password
    </label>

    <input
        type="password"
        name="password"
        autocomplete="current-password"
        required
    >

    <button type="submit">
        Login
    </button>

</form>

<p class="auth-footer">

    Don't have an account?

    <a href="{{ url_for('register') }}">
        Create one
    </a>

</p>

</div>
{% endblock %}
